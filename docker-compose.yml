services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcare_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthcare} -d ${POSTGRES_DB:-healthcare_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- n8n Workflow Engine ----
  n8n:
    image: n8nio/n8n:latest
    container_name: healthcare-n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-to-a-random-string}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-healthcare_platform}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-healthcare}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-healthcare_dev_2024}
      - GENERIC_TIMEZONE=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - NODE_FUNCTION_ALLOW_BUILTIN=*
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-healthcare}:${POSTGRES_PASSWORD:-healthcare_dev_2024}@postgres:5432/${POSTGRES_DB:-healthcare_platform}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - N8N_WEBHOOK_URL=http://n8n:5678
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-mock}
      - SAFETY_CONFIDENCE_THRESHOLD=${SAFETY_CONFIDENCE_THRESHOLD:-0.7}
      - SAFETY_RISK_SCORE_EMERGENCY=${SAFETY_RISK_SCORE_EMERGENCY:-8}
      - SAFETY_RISK_SCORE_URGENT=${SAFETY_RISK_SCORE_URGENT:-5}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  # ---- Frontend (Nginx) ----
  frontend:
    image: nginx:alpine
    container_name: healthcare-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  n8n_data:
